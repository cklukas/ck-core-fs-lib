name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_qualification:
        description: 'Qualify on a self-hosted Mac with S8T/PRO-BLADE temporary volumes'
        type: boolean
        default: false

concurrency:
  group: ck-core-fs-native-qualification
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 1
  CTEST_PARALLEL_LEVEL: 1

jobs:
  build:
    name: ${{ matrix.os }} / browser ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CK_FS_NAMESPACE_BOOTSTRAP: ${{ matrix.os == 'ubuntu-24.04' && 'privileged-id-map' || 'unprivileged' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2025]
        browser: ['ON']
        include:
          - os: ubuntu-24.04
            browser: 'OFF'
    steps:
      - name: Require controlled Windows runner storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP) -or -not [IO.Directory]::Exists($tempRoot)) { throw 'Existing absolute runner temporary root required' }
          if ($env:CK_FS_REQUIRE_V_DEV_DRIVE -ceq '1') {
            if (-not [IO.Directory]::Exists('V:\')) { throw 'Workstation requires development drive V:' }
            foreach ($path in @($tempRoot, $env:GITHUB_WORKSPACE)) {
              if (-not [IO.Path]::GetFullPath($path).StartsWith('V:\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Workstation scratch and checkout must be on V:' }
            }
            if (-not $tempRoot.StartsWith('V:\tmp\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Workstation temporary root must be under V:\tmp' }
          }
          # Discovery below is drive-based; do not guess through reparse aliases.
          $ancestor = [IO.DirectoryInfo]::new($tempRoot)
          while ($null -ne $ancestor) {
            if (([IO.File]::GetAttributes($ancestor.FullName) -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Controlled runner temporary ancestry must not redirect' }
            $ancestor = $ancestor.Parent
          }
          $bootstrap = Join-Path $tempRoot ('ckfs-bootstrap-' + [guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($bootstrap) | Out-Null
          foreach ($key in @('TMPDIR', 'TEMP', 'TMP')) { "$key=$bootstrap" >> $env:GITHUB_ENV }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require isolated ordinary-user mount fixture bootstrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          task=$(mktemp -d "$RUNNER_TEMP/ckfs-namespace.XXXXXXXX")
          trap 'rm -rf -- "$task"' EXIT
          export TMPDIR="$task" TEMP="$task" TMP="$task"
          python3 tests/run_private_scope_mounts.py --probe "$task"
      - name: Build, test, install, and run installed C consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $task = Join-Path '${{ runner.temp }}' 'ck-core-fs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}'
          $callerTmp = Join-Path '${{ runner.temp }}' ('ckfs-caller-' + [guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($callerTmp) | Out-Null
          $env:TMPDIR = $callerTmp
          $env:TEMP = $callerTmp
          $env:TMP = $callerTmp
          $qualification = @("-DQUALIFICATION_OUTPUT=$task", "-DQUALIFICATION_BROWSER=${{ matrix.browser }}")
          if ($IsWindows) {
            # Mandatory source-only admission BEFORE any backend configure/build/test.
            python tools/check_windows_runtime_hooks.py --source "$PWD" --report (Join-Path $callerTmp 'windows-hook-preflight.json')
            if ($LASTEXITCODE -ne 0) { throw 'Windows runtime-hook fixture migration remains incomplete' }
            [IO.Directory]::CreateDirectory($env:TMPDIR) | Out-Null
            $fixture = Join-Path $env:TMPDIR 'native-fixture'
            [IO.Directory]::CreateDirectory($fixture) | Out-Null
            $provider = & ./tools/windows_fixture_provider.ps1 -FixtureRoot $fixture -Report (Join-Path $env:TMPDIR 'windows-provider.json')
            $qualification += "-DQUALIFICATION_WINDOWS_TEST_FS=$provider", "-DQUALIFICATION_NATIVE_TEST_ROOT=$fixture"
          }
          # The helper refuses stale output directories; bootstrap/preflight lives separately.
          cmake @qualification -P tools/qualification.cmake
          exit $LASTEXITCODE

  sanitizers:
    name: Linux / ${{ matrix.sanitizer }}
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer: [address-undefined, thread]
    env:
      CK_FS_NAMESPACE_BOOTSTRAP: privileged-id-map
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require isolated ordinary-user mount fixture bootstrap
        shell: bash
        run: |
          set -euo pipefail
          task=$(mktemp -d "$RUNNER_TEMP/ckfs-namespace.XXXXXXXX")
          trap 'rm -rf -- "$task"' EXIT
          export TMPDIR="$task" TEMP="$task" TMP="$task"
          python3 tests/run_private_scope_mounts.py --probe "$task"
      - name: Select a current installed Clang
        shell: bash
        run: |
          set -euo pipefail
          for version in 23 22 21 20; do
            if command -v "clang-$version" >/dev/null && command -v "clang++-$version" >/dev/null; then
              echo "CC=clang-$version" >> "$GITHUB_ENV"
              echo "CXX=clang++-$version" >> "$GITHUB_ENV"
              "clang-$version" --version
              exit 0
            fi
          done
          echo '::error::Qualification requires installed Clang >=20; no kernel/ASLR changes or sanitizer suppressions are permitted.'
          exit 1
      - name: Qualify fully instrumented sources and threaded jobs
        shell: bash
        run: |
          set -euo pipefail
          task="$RUNNER_TEMP/ck-core-fs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.sanitizer }}"
          export TMPDIR="$task/tmp" TEMP="$task/tmp" TMP="$task/tmp"
          cmake -DQUALIFICATION_OUTPUT="$task" \
            -DQUALIFICATION_SANITIZER=${{ matrix.sanitizer }} \
            -DQUALIFICATION_SHARED_THREAD_RUNTIME=${{ matrix.sanitizer == 'thread' && 'ON' || 'OFF' }} \
            -P tools/qualification.cmake

  macos:
    name: Mac qualification / requires mounted temporary volume
    needs: sanitizers
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.macos_qualification
    runs-on: [self-hosted, macOS, ck-core-fs-qualification]
    timeout-minutes: 20
    steps:
      # Configure this runner's own temporary storage beneath S8T/tmp or
      # PRO-BLADE/tmp before assigning the ck-core-fs-qualification label.
      - name: Require permitted runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          actual_temp=$(cd -P "$RUNNER_TEMP" && pwd -P)
          actual_workspace=$(cd -P "$GITHUB_WORKSPACE" && pwd -P)
          allowed_temp=false
          allowed_workspace=false
          for volume in S8T PRO-BLADE; do
            if /sbin/mount | /usr/bin/grep -F " on /Volumes/$volume " >/dev/null; then
              case "$actual_temp/" in "/Volumes/$volume/tmp/"*) allowed_temp=true ;; esac
              case "$actual_workspace/" in "/Volumes/$volume/tmp/"*) allowed_workspace=true ;; esac
            fi
          done
          if [ "$allowed_temp" != true ] || [ "$allowed_workspace" != true ]; then
            echo '::error::Mac runner needs mounted S8T or PRO-BLADE and temporary storage and checkout under the permitted mounted volumes. No system-temp fallback.'
            exit 1
          fi
          task=$(mktemp -d "$RUNNER_TEMP/ck-core-fs-bootstrap.XXXXXXXX")
          echo "TMPDIR=$task" >> "$GITHUB_ENV"
          echo "TEMP=$task" >> "$GITHUB_ENV"
          echo "TMP=$task" >> "$GITHUB_ENV"
          echo "CK_MAC_BOOTSTRAP=$task" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build, test, install, and run installed C consumer
        shell: bash
        run: cmake "-DQUALIFICATION_OUTPUT=$CK_MAC_BOOTSTRAP/qualification" -P tools/qualification.cmake
      - name: Release bootstrap temporary storage
        if: always() && env.CK_MAC_BOOTSTRAP != ''
        shell: bash
        run: |
          case "$CK_MAC_BOOTSTRAP" in
            "$RUNNER_TEMP"/ck-core-fs-bootstrap.*) cmake -E rm -rf "$CK_MAC_BOOTSTRAP" ;;
            *) echo 'Unexpected bootstrap path; refusing cleanup'; exit 1 ;;
          esac
