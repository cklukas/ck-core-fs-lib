name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 6
      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure
      - name: Install
        run: cmake --install build --config RelWithDebInfo --prefix install
      - name: Build installed C consumer
        shell: bash
        run: |
          cmake -S tests/consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$PWD/install" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build consumer-build --config RelWithDebInfo --parallel 6
