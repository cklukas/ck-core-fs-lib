name: pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v5
        with:
          repository: cklukas/ck-git-hosting
          ref: 7e3ee5eb57a2cef2e07f9e9fe5c4e2822502d322
          path: .docs-tool
          persist-credentials: false
      - name: Build pinned ckdocs
        run: |
          work="$RUNNER_TEMP/ckdocs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work/tmp" "$work/build"
          export TMPDIR="$work/tmp"
          make -j2 -C .docs-tool BUILD_ROOT="$work" BUILD_DIR="$work/build" \
            CKGIT_BUILD_VERSION=0.10.1+g7e3ee5eb57a2 \
            "$work/build/bin/ckdocs"
          echo "CKDOCS=$work/build/bin/ckdocs" >> "$GITHUB_ENV"
      - name: Build the site
        run: "$CKDOCS" build --root "$PWD" --out "$RUNNER_TEMP/site" --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
